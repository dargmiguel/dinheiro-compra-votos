<text x="64" y="949" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172A3A"><tspan>Candidaturas negras tiveram receitas e despesas medianas menores que as brancas.</tspan></text>
<text x="64" y="987" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172A3A"><tspan>Eram </tspan><tspan font-weight="700" fill="#6B4A8F">47,6%</tspan><tspan> das candidaturas, mas só </tspan><tspan font-weight="700" fill="#6B4A8F">27,3%</tspan><tspan> dos eleitos.</tspan></text>
<line x1="64" y1="1050" x2="1016" y2="1050" stroke="#D8D9D2" stroke-width="2"/>
<text x="64.0" y="1109.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Mediana: valor central do grupo; não indica o que cada candidatura recebeu ou gastou.</text>
<text x="64.0" y="1133.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Receita: candidaturas com receita observada. Participação: parcela entre candidaturas e eleitos.</text>
<text x="64.0" y="1157.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Comparação descritiva; não demonstra que raça/cor ou dinheiro causou o resultado.</text>
<text x="64.0" y="1181.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Brancas e negras somam ~98% das candidaturas e dos eleitos; demais categorias: ver apoio.</text>
<text x="64.0" y="1205.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Fonte: TSE 2022 · candidaturas APTO; receitas financeiras e despesas contratadas finais observadas.</text>
