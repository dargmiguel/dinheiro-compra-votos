<line x1="880.0" y1="723" x2="880.0" y2="885" stroke="#E8E8E1" stroke-width="1"/>
<text x="64.0" y="774.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#B34F3D">Mulheres</text>
