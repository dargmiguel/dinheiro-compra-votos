<rect x="475.2" y="728" width="330" height="32" fill="#F7F6F1" rx="0"/>
<text x="481.2" y="753" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#B34F3D"><tspan>35,5%</tspan><tspan font-size="22" font-weight="400"> 3.266 candidaturas</tspan></text>
<rect x="240" y="766" width="112.63999999999999" height="34" fill="#B34F3D" rx="4"/>
