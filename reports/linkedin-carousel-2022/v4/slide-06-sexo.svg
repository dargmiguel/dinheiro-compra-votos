<text x="366.6" y="792" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#B34F3D"><tspan>17,6%</tspan><tspan font-size="22" font-weight="400"> 90 eleitas</tspan></text>
<text x="64.0" y="859.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#0B514D">Homens</text>
<rect x="240" y="812" width="412.79999999999995" height="34" fill="#8DACA7" rx="4"/>
<rect x="660.8" y="813" width="330" height="32" fill="#F7F6F1" rx="0"/>
<text x="666.8" y="838" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B514D"><tspan>64,5%</tspan><tspan font-size="22" font-weight="400"> 5.936 candidaturas</tspan></text>
<rect x="240" y="851" width="527.36" height="34" fill="#0B514D" rx="4"/>
<rect x="775.36" y="852" width="236" height="32" fill="#F7F6F1" rx="0"/>
<text x="781.4" y="877" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B514D"><tspan>82,4%</tspan><tspan font-size="22" font-weight="400"> 420 eleitos</tspan></text>
<text x="64" y="949" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172A3A"><tspan>Receitas e despesas medianas parecidas, mas participação diferente:</tspan></text>
<text x="64" y="987" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172A3A"><tspan>mulheres eram </tspan><tspan font-weight="700" fill="#B34F3D">35,5%</tspan><tspan> das candidaturas e </tspan><tspan font-weight="700" fill="#B34F3D">17,6%</tspan><tspan> dos eleitos.</tspan></text>
<line x1="64" y1="1050" x2="1016" y2="1050" stroke="#D8D9D2" stroke-width="2"/>
<text x="64.0" y="1085.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Mediana: valor central do grupo; proximidade não significa valores iguais para cada candidatura.</text>
<text x="64.0" y="1109.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Participação no total: parcela de cada grupo entre todas as candidaturas e entre todos os eleitos.</text>
<text x="64.0" y="1133.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Comparação descritiva; não demonstra que gênero ou despesa causou o resultado.</text>
<text x="64.0" y="1157.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Gênero conforme o registro de candidatura no TSE (feminino ou masculino);</text>
<text x="64.0" y="1181.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">a base não identifica pessoas trans ou não binárias.</text>
<text x="64.0" y="1205.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5D6D74">Fonte: TSE 2022 · candidaturas APTO; receitas financeiras e despesas contratadas finais observadas.</text>
<text x="64.0" y="1170.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5D6D74"></text>
<line x1="64" y1="1235" x2="1016" y2="1235" stroke="#D8D9D2" stroke-width="2"/>
<text x="64.0" y="1270.0" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" text-anchor="start" fill="#0B514D" letter-spacing="0.2">ELEIÇÕES FEDERAIS 2022  ·  TSE</text>
<text x="1016.0" y="1270.0" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" text-anchor="end" fill="#5D6D74">2022</text>
