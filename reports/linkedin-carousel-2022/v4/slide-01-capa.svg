<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Bilhões em campanhas. Quem chegou à Câmara?</title>
<rect x="0" y="0" width="1080" height="1350" fill="#F7F6F1" rx="0"/>
<text x="64.0" y="48.0" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" text-anchor="start" fill="#0B514D" letter-spacing="0.7">CADERNO DE DADOS  /  ELEIÇÕES 2022</text>
<text x="1016.0" y="48.0" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="600" text-anchor="end" fill="#5D6D74">01 / 08</text>
<line x1="64" y1="69" x2="1016" y2="69" stroke="#172A3A" stroke-width="2"/>
<text x="64.0" y="135.0" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700" text-anchor="start" fill="#172A3A">Bilhões em campanhas.</text>
<text x="64.0" y="183.0" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700" text-anchor="start" fill="#172A3A">Quem chegou à Câmara?</text>
<text x="64.0" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5D6D74">Deputados federais · Brasil · 1º turno de 2022</text>
<rect x="64" y="246" width="952" height="384" fill="#0B514D" rx="5"/>
<text x="104.0" y="296.0" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" text-anchor="start" fill="#DDECE8" letter-spacing="0.5">DESPESAS CONTRATADAS DECLARADAS</text>
<text x="104.0" y="412.0" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" text-anchor="start" fill="#FFFFFF">R$ 3,08 bilhões</text>
<text x="104.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#FFFFFF">por 9.204 candidaturas a deputado federal</text>
<text x="104.0" y="516.0" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="500" text-anchor="start" fill="#DDECE8">Brasil · 1º turno · 2022</text>
<rect x="752" y="290" width="216" height="292" fill="#F7F6F1" rx="4" stroke="#D8D9D2" stroke-width="2"/>
<text x="774.0" y="330.0" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" text-anchor="start" fill="#0B514D">PRESTAÇÃO</text>
<text x="774.0" y="358.0" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" text-anchor="start" fill="#5D6D74">2022 · TSE</text>
<line x1="774" y1="378" x2="944" y2="378" stroke="#D8D9D2" stroke-width="2"/>
<text x="774.0" y="416.0" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" text-anchor="start" fill="#5D6D74">DESPESAS</text>
<rect x="774" y="431" width="154" height="10" fill="#DDECE8" rx="2"/>
<rect x="774" y="456" width="132" height="10" fill="#DDECE8" rx="2"/>
<rect x="774" y="481" width="161" height="10" fill="#DDECE8" rx="2"/>
<line x1="774" y1="507" x2="944" y2="507" stroke="#D8D9D2" stroke-width="2"/>
<text x="774.0" y="548.0" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" text-anchor="start" fill="#B34F3D">FINAL</text>
<rect x="64" y="660" width="952" height="350" fill="#FFFFFF" rx="5" stroke="#D8D9D2" stroke-width="2"/>
<text x="104.0" y="706.0" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" text-anchor="start" fill="#5D6D74">RECEITAS FINANCEIRAS · OUTRA MEDIDA</text>
<text x="104.0" y="812.0" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" text-anchor="start" fill="#B34F3D">88,3%</text>
<text x="396.0" y="778.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#172A3A">das receitas financeiras</text>
<text x="396.0" y="815.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#172A3A">declaradas eram públicas</text>
<rect x="104" y="850" width="872" height="36" fill="#F3E2DC" rx="3"/>
<rect x="104" y="850" width="770.25068" height="36" fill="#14766F" rx="3"/>
<text x="104.0" y="930.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#0B514D">Públicas · R$ 2,70 bilhões</text>
<text x="976.0" y="930.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="end" fill="#B34F3D">Outros Recursos · R$ 356,3 mi</text>
<text x="104.0" y="977.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#5D6D74">Receitas financeiras declaradas: R$ 3,05 bilhões</text>
<line x1="64" y1="1060" x2="1016" y2="1060" stroke="#D8D9D2" stroke-width="2"/>
<text x="64.0" y="1090.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5D6D74">R$ 3,08 bi = despesas contratadas; 88,3% = participação pública nas receitas financeiras.</text>
<text x="64.0" y="1170.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5D6D74">Fonte: TSE 2022 · prestações de contas e receitas financeiras declaradas.</text>
<line x1="64" y1="1235" x2="1016" y2="1235" stroke="#D8D9D2" stroke-width="2"/>
<text x="64.0" y="1270.0" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" text-anchor="start" fill="#0B514D" letter-spacing="0.2">ELEIÇÕES FEDERAIS 2022  ·  TSE</text>
<text x="1016.0" y="1270.0" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" text-anchor="end" fill="#5D6D74">2022</text>
